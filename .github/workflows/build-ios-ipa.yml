name: Build iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LUME_REF: ${{ github.sha }}
  ENGINE_REF: v0.5.0
  RECORDER_REF: v0.1.1
  # LumeCloud had no release tag when Lume 3.1.0 shipped. Pin the compatible
  # main commit that existed before the release instead of following main.
  CLOUD_REF: 2180a86d9f589dce0cbe4edfe4f261f8fcede3ba

jobs:
  build-ios:
    name: Build unsigned iPhone IPA
    runs-on: xcode-27
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: Lume

    steps:
      - name: Checkout Lume
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: Lume

      - name: Checkout compatible LumeEngine
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeEngine
          ref: ${{ env.ENGINE_REF }}
          path: LumeEngine

      - name: Checkout compatible LumeRecorder
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeRecorder
          ref: ${{ env.RECORDER_REF }}
          path: LumeRecorder

      - name: Checkout compatible LumeCloud
        uses: actions/checkout@v5
        with:
          repository: bilipp/LumeCloud
          ref: ${{ env.CLOUD_REF }}
          path: LumeCloud

      - name: Select and verify Xcode 27.2
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version | tee "$RUNNER_TEMP/xcode-version.txt"
          version="$(xcodebuild -version | awk '/Xcode/{print $2}')"
          python3 - "$version" <<'PY'
          import sys
          parts = tuple(int(p) for p in sys.argv[1].split('.')[:2])
          if parts < (27, 2):
              raise SystemExit(f"Xcode 27.2+ required; runner has {sys.argv[1]}")
          PY

      - name: Download Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Write optional API configuration
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          INTRO_DB_API_KEY: ${{ secrets.INTRO_DB_API_KEY }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
        run: |
          set -euo pipefail
          {
            [ -n "$TMDB_ACCESS_TOKEN" ]     && echo "TMDB_ACCESS_TOKEN=$TMDB_ACCESS_TOKEN"
            [ -n "$MDBLIST_API_KEY" ]       && echo "MDBLIST_API_KEY=$MDBLIST_API_KEY"
            [ -n "$INTRO_DB_API_KEY" ]      && echo "INTRO_DB_API_KEY=$INTRO_DB_API_KEY"
            [ -n "$OPENSUBTITLES_API_KEY" ] && echo "OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY"
            [ -n "$TRAKT_CLIENT_ID" ]       && echo "TRAKT_CLIENT_ID=$TRAKT_CLIENT_ID"
            [ -n "$TRAKT_CLIENT_SECRET" ]   && echo "TRAKT_CLIENT_SECRET=$TRAKT_CLIENT_SECRET"
            [ -n "$SIMKL_CLIENT_ID" ]       && echo "SIMKL_CLIENT_ID=$SIMKL_CLIENT_ID"
            [ -n "$SIMKL_CLIENT_SECRET" ]   && echo "SIMKL_CLIENT_SECRET=$SIMKL_CLIENT_SECRET"
            [ -n "$MDBLIST_CLIENT_ID" ]     && echo "MDBLIST_CLIENT_ID=$MDBLIST_CLIENT_ID"
          } > .env || true

      - name: Resolve Swift packages
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project Lume.xcodeproj \
            -scheme Lume \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/Lume-SPM" \
            2>&1 | tee "$RUNNER_TEMP/resolve.log"

      - name: Archive unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Sideload \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lume-iPhone.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/Lume-DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/Lume-SPM" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            ENABLE_HARDENED_RUNTIME=NO \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package and validate IPA
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/Lume-iPhone.xcarchive"
          app="$(find "$archive/Products/Applications" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -f "$app/Info.plist"

          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          executable="$app/$executable_name"
          test -f "$executable"

          file "$executable" | tee "$RUNNER_TEMP/executable-file.txt"
          lipo -archs "$executable" | tee "$RUNNER_TEMP/executable-architectures.txt"
          lipo -archs "$executable" | tr ' ' '\n' | grep -qx arm64
          ! lipo -archs "$executable" | grep -Eq 'x86_64|i386'
          test "$bundle_id" = 'com.bilipp.lume'
          test "$version" = '3.1.0'
          test "$build" = '37'
          test ! -e "$app/embedded.mobileprovision"
          if codesign -dv "$app" >"$RUNNER_TEMP/codesign.txt" 2>&1; then
            echo 'Expected unsigned app, but codesign found a signature' >&2
            cat "$RUNNER_TEMP/codesign.txt" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/artifact"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/artifact/Lume-iPhone-unsigned.ipa" Payload)

          unzip -t "$RUNNER_TEMP/artifact/Lume-iPhone-unsigned.ipa" | tee "$RUNNER_TEMP/unzip-test.txt"
          unzip -l "$RUNNER_TEMP/artifact/Lume-iPhone-unsigned.ipa" | tee "$RUNNER_TEMP/ipa-contents.txt"
          test "$(stat -f%z "$RUNNER_TEMP/artifact/Lume-iPhone-unsigned.ipa")" -gt 1000000

          find "$app/Frameworks" -maxdepth 2 -print | sort | tee "$RUNNER_TEMP/frameworks.txt"
          test -d "$app/Frameworks"
          test -n "$(find "$app/Frameworks" -mindepth 1 -maxdepth 1 -print -quit)"
          find "$app" -name '*.appex' -print | sort | tee "$RUNNER_TEMP/extensions.txt"

          {
            echo "Lume commit: $LUME_REF"
            echo "LumeEngine ref: $ENGINE_REF"
            echo "LumeRecorder ref: $RECORDER_REF"
            echo "LumeCloud ref: $CLOUD_REF"
            cat "$RUNNER_TEMP/xcode-version.txt"
            echo "App: $(basename "$app")"
            echo "Bundle identifier: $bundle_id"
            echo "Version: $version ($build)"
            echo "Executable: $executable_name"
            echo "Architectures: $(lipo -archs "$executable")"
            echo "IPA bytes: $(stat -f%z "$RUNNER_TEMP/artifact/Lume-iPhone-unsigned.ipa")"
            shasum -a 256 "$RUNNER_TEMP/artifact/Lume-iPhone-unsigned.ipa"
            echo 'Embedded code objects:'
            find "$app" \( -name '*.framework' -o -name '*.appex' \) -print | sort
            echo 'Dynamic dependencies:'
            otool -L "$executable"
          } | tee "$RUNNER_TEMP/artifact/validation-report.txt"

          cp "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/artifact/build.log"
          cp "$RUNNER_TEMP/resolve.log" "$RUNNER_TEMP/artifact/resolve.log"
          cp "$RUNNER_TEMP/ipa-contents.txt" "$RUNNER_TEMP/artifact/ipa-contents.txt"
          cp "$RUNNER_TEMP/frameworks.txt" "$RUNNER_TEMP/artifact/frameworks.txt"
          cp "$RUNNER_TEMP/extensions.txt" "$RUNNER_TEMP/artifact/extensions.txt"

      - name: Upload unsigned IPA and verification logs
        uses: actions/upload-artifact@v4
        with:
          name: Lume-v3.1.0-iPhone-unsigned
          path: ${{ runner.temp }}/artifact/
          if-no-files-found: error
          retention-days: 30
